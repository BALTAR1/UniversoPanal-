<svg width="1920" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Gradiente de fondo -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563EB;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Fondo con gradiente -->
  <rect width="1920" height="600" fill="url(#grad1)"/>
  
  <!-- Texto central -->
  <text x="960" y="250" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="white" text-anchor="middle">
    Mundo Pañal
  </text>
  <text x="960" y="320" font-family="Arial, sans-serif" font-size="36" fill="white" text-anchor="middle" opacity="0.9">
    Tu tienda de confianza para el cuidado del bebé
  </text>
  <text x="960" y="380" font-family="Arial, sans-serif" font-size="24" fill="white" text-anchor="middle" opacity="0.8">
    Pañales • Toallitas • Cremas • Accesorios
  </text>
  
  <!-- Decoración: círculos -->
  <circle cx="150" cy="100" r="60" fill="white" opacity="0.1"/>
  <circle cx="1770" cy="500" r="80" fill="white" opacity="0.1"/>
  <circle cx="300" cy="500" r="40" fill="white" opacity="0.15"/>
  <circle cx="1620" cy="120" r="50" fill="white" opacity="0.12"/>
</svg>
